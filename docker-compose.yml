services:
  # profile "local": run Ollama in-container (Mac / no GPU / Nvidia GPU).
  # No profile (default): use a remote OLLAMA_URL instead — this service is skipped.
  ollama:
    image: ollama/ollama:latest
    container_name: ally-ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama


  api-server:
    build: ./api
    container_name: ally-api
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      API_KEY: ${API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      MAX_CONTEXT_LEN: ${MAX_CONTEXT_LEN}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      OLLAMA_CF_ACCESS_CLIENT_ID: ${OLLAMA_CF_ACCESS_CLIENT_ID}
      OLLAMA_CF_ACCESS_CLIENT_SECRET: ${OLLAMA_CF_ACCESS_CLIENT_SECRET}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    volumes:
      - ./api:/app
      - whisperx_models:/root/.cache/huggingface
      - torch_models:/root/.cache/torch

volumes:
  ollama_data:
  whisperx_models:
  torch_models:
