services:
  ollama:
    image: ollama/ollama:latest
    container_name: ally-ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama

  whisperx:
    build: ./whisperx-server
    container_name: ally-whisperx
    profiles: ["local"]
    expose:
      - "8001"
    environment:
      WHISPERX_API_KEY: ${WHISPERX_API_KEY}
      WHISPERX_MODEL: ${WHISPERX_MODEL:-base}
      WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-en}
      WHISPERX_BATCH_SIZE: ${WHISPERX_BATCH_SIZE:-4}
      WHISPERX_DIARIZE: ${WHISPERX_DIARIZE:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    volumes:
      - whisperx_models:/root/.cache/huggingface
      - torch_models:/root/.cache/torch
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  api-server:
    build: ./api
    container_name: ally-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      API_KEY: ${API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      MAX_CONTEXT_LEN: ${MAX_CONTEXT_LEN}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      OLLAMA_CF_ACCESS_CLIENT_ID: ${OLLAMA_CF_ACCESS_CLIENT_ID:-}
      OLLAMA_CF_ACCESS_CLIENT_SECRET: ${OLLAMA_CF_ACCESS_CLIENT_SECRET:-}
      WHISPERX_CF_ACCESS_CLIENT_ID: ${WHISPERX_CF_ACCESS_CLIENT_ID:-}
      WHISPERX_CF_ACCESS_CLIENT_SECRET: ${WHISPERX_CF_ACCESS_CLIENT_SECRET:-}
      WHISPERX_URL: ${WHISPERX_URL}
      WHISPERX_API_KEY: ${WHISPERX_API_KEY}
      WHISPERX_TIMEOUT: ${WHISPERX_TIMEOUT:-900}
    volumes:
      - ./api:/app

volumes:
  ollama_data:
  whisperx_models:
  torch_models: